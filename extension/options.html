<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Site Layout Memory</title>
<link rel="stylesheet" href="ui.css">
<style> body { max-width: 640px; } </style>
</head>
<body>
  <div id="status" class="status">Checking the helper program…</div>

  <h2>What counts as one site</h2>
  <label><input type="radio" name="scope" value="domain"> Whole domain <span class="muted">(mail.google.com and docs.google.com share one layout)</span></label>
  <label><input type="radio" name="scope" value="host"> Each subdomain separately <span class="muted">(mail.google.com and docs.google.com each have their own)</span></label>
  <p class="hint">You can override this for individual domains from the toolbar popup.</p>

  <div id="overridesBox" class="hidden">
    <h2>Domains with their own rule</h2>
    <table><tbody id="overrides"></tbody></table>
  </div>

  <h2>A site you haven't visited before</h2>
  <label><input type="radio" name="newSite" value="keep"> Keeps the layout that's active, and remembers it</label>
  <label><input type="radio" name="newSite" value="fixed"> Starts with <select id="newSiteLayout"></select></label>

  <h2>Remembered sites <span class="muted" id="count"></span></h2>
  <p><input type="text" id="filter" placeholder="Filter…" style="width: 220px"></p>
  <table>
    <thead><tr><th>Site</th><th>Layout</th><th title="Always use this layout; don't save changes">Locked</th><th></th></tr></thead>
    <tbody id="sites"></tbody>
  </table>
  <p><button id="forgetAll">Forget all sites</button></p>

  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
